    requirements: [REQ-RET-01, REQ-RET-02, REQ-RET-03, REQ-RET-04]
    providers: [backend]
    consumers: [frontend]
    artifacts:
      - api.openapi.yaml
      - scenarios.yaml

  - id: RETURN-ADMIN-API
    revision: 1
    status: FROZEN
    requirements: [REQ-RET-04, REQ-RET-05, REQ-RET-06, REQ-RET-07, REQ-RET-08, REQ-RET-09]
    providers: [backend]
    consumers: [frontend-admin]
    artifacts:
      - api.openapi.yaml
      - scenarios.yaml

  - id: ORDER-DELIVEREDAT-FIELD
    revision: 1
    status: FROZEN
    requirements: [REQ-RET-02]
    providers: [backend]
    consumers: [frontend, frontend-admin]
