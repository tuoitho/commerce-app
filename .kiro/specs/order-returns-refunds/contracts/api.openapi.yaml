openapi: 3.1.0
info:
  title: Returns & Refunds API contracts
  version: 1.0.0
  description: |
    Hợp đồng thực thi cho feature `order-returns-refunds`, gồm hai boundary API
    (RETURN-CUSTOMER-API, RETURN-ADMIN-API) và một bổ sung additive trên order
    response hiện có (ORDER-DELIVEREDAT-FIELD).

    ## Quy ước chung (Full Status Envelope)
    - Success 200/201: `{ success: true, message, data, error: null, meta: { timestamp, pagination? } }`
    - Error 4xx/5xx: `{ success: false, message, data: null, error: { code, message, fields? }, meta: { timestamp } }`
    - Tiền tệ VND: chuỗi số nguyên (MoneyVND), ví dụ "1299000".
    - Lỗi kinh doanh: `error.code` đặc thù + `error.message` tiếng Việt, KHÔNG có `fields`.
      Lỗi xác thực HTTP 400: `validation_error` + `error.fields` ánh xạ trường → thông báo.

    ## Quy tắc ngữ nghĩa không diễn đạt được bằng schema
    - SR1 Cửa sổ trả hàng: chỉ tạo được yêu cầu khi `now <= orders.delivered_at + 7 ngày`
      (server-authoritative; client dùng `deliveredAt` chỉ để hiển thị).
    - SR2 Trạng thái đơn đủ điều kiện tạo yêu cầu: `delivered` hoặc `returned`.
    - SR3 Một yêu cầu mở mỗi đơn: tồn tại request `pending_approval|approved` → chặn tạo mới.
    - SR4 Lượng tiêu thụ mỗi dòng = SUM(quantity) của items thuộc requests có trạng thái
      `pending_approval|approved|received|refunded`; lượng còn được phép = quantity đã mua − lượng tiêu thụ.
    - SR5 Scope chủ sở hữu phía khách: đơn/yêu cầu không thuộc user gọi API trả về 404
      (`order_not_found` / `return_request_not_found`), KHÔNG tiết lộ sự tồn tại.
    - SR6 Tiền đề nghị (`suggestedRefundVnd`) = Σ(unitPriceVnd × quantity) của các dòng trong yêu cầu,
      cộng `shippingFeeVnd` của đơn nếu đây là lần hoàn tiền ĐẦU TIÊN của đơn đó.
    - SR7 Ghi nhận hoàn tiền chuyển request sang `refunded` và đặt `orders.status='returned'`
      (giữ nguyên nếu đã là `returned`) trong cùng transaction.
    - SR8 Chỉ admin xác nhận nhận hàng mới hoàn kho: cộng tồn kho biến thể đúng số lượng từng dòng.

servers:
  - url: /api/v1

tags:
  - name: customer-return-requests
  - name: admin-return-requests

paths:
  /orders/{orderId}/return-requests:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: CreateReturnRequest
      tags: [customer-return-requests]
      summary: Tạo yêu cầu trả hàng theo từng mặt hàng (R1, R2)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReturnRequestInput' }
      responses:
        '201':
          description: Đã tạo yêu cầu ở trạng thái pending_approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRequestEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409':
          description: |
            return_not_allowed | return_window_expired | return_request_exists |
            return_item_limit_exceeded (SR1–SR4)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    get:
      operationId: ListReturnRequestsByOrder
      tags: [customer-return-requests]
      summary: Danh sách yêu cầu trả hàng của đơn (mới nhất trước) (R4)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Mảng rỗng nếu chưa có yêu cầu nào
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRequestListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/OrderNotFound' }

  /orders/{orderId}/return-requests/{requestId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/ReturnRequestId'
    post:
      operationId: CancelReturnRequest
      tags: [customer-return-requests]
      summary: Khách rút yêu cầu khi còn chờ duyệt (R3)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Yêu cầu chuyển sang cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRequestEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ReturnNotFound' }
        '409':
          description: return_action_not_allowed — yêu cầu không còn pending_approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /admin/return-requests:
    get:
      operationId: AdminListReturnRequests
      tags: [admin-return-requests]
      summary: Danh sách yêu cầu trả hàng, lọc trạng thái + phân trang (R5)
      security: [{ bearerAdminAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ReturnRequestStatus' }
          description: Bỏ trống = tất cả
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Sắp xếp createdAt giảm dần; phân trang qua meta.pagination
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReturnRequestListEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/return-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/ReturnRequestId'
    get:
      operationId: AdminGetReturnRequest
      tags: [admin-return-requests]
      summary: Chi tiết yêu cầu trả hàng (kèm suggestedRefundVnd theo SR6) (R5, R8)
      security: [{ bearerAdminAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReturnRequestEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ReturnNotFoundAdmin' }

  /admin/return-requests/{requestId}/approve:
    parameters:
      - $ref: '#/components/parameters/ReturnRequestId'
    post:
      operationId: ApproveReturnRequest
      tags: [admin-return-requests]
      summary: Duyệt yêu cầu từ pending_approval (không hoàn kho ở bước này) (R6)
      security: [{ bearerAdminAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReturnRequestEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ReturnNotFoundAdmin' }
        '409': { $ref: '#/components/responses/ReturnActionNotAllowed' }

  /admin/return-requests/{requestId}/reject:
    parameters:
      - $ref: '#/components/parameters/ReturnRequestId'
    post:
      operationId: RejectReturnRequest
      tags: [admin-return-requests]
      summary: Từ chối yêu cầu từ pending_approval, bắt buộc lý do hiển thị cho khách (R6)
      security: [{ bearerAdminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectReturnRequestInput' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReturnRequestEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ReturnNotFoundAdmin' }
        '409': { $ref: '#/components/responses/ReturnActionNotAllowed' }

  /admin/return-requests/{requestId}/receive:
    parameters:
      - $ref: '#/components/parameters/ReturnRequestId'
    post:
      operationId: ReceiveReturnRequest
      tags: [admin-return-requests]
      summary: Xác nhận đã nhận lại hàng — hoàn kho nguyên tử trong transaction (SR8, R7)
      security: [{ bearerAdminAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReturnRequestEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ReturnNotFoundAdmin' }
        '409': { $ref: '#/components/responses/ReturnActionNotAllowed' }
        '500':
          description: Lỗi hoàn kho — rollback, trạng thái yêu cầu và tồn kho giữ nguyên (R7.4)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /admin/return-requests/{requestId}/refund:
    parameters:
      - $ref: '#/components/parameters/ReturnRequestId'
    post:
      operationId: RecordReturnRefund
      tags: [admin-return-requests]
      summary: Ghi nhận hoàn tiền thủ công; lần đầu tiên đặt đơn thành returned (SR6, SR7, R8, R9)
      security: [{ bearerAdminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordRefundInput' }
      responses:
        '200':
          description: Request refunded; response chứa refundAmountVnd = số tiền đã ghi nhận
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReturnRequestEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ReturnNotFoundAdmin' }
        '409': { $ref: '#/components/responses/ReturnActionNotAllowed' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    bearerAdminAuth: { type: http, scheme: bearer, bearerFormat: JWT, description: JWT role=admin }

  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReturnRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Thiếu hoặc hết hạn access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            message: Phiên đăng nhập không hợp lệ hoặc đã hết hạn
            data: null
            error: { code: unauthorized, message: Phiên đăng nhập không hợp lệ hoặc đã hết hạn }
            meta: { timestamp: '2026-08-22T09:00:00Z' }
    Forbidden:
      description: Role không phải admin
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            message: Bạn không có quyền thực hiện thao tác này
            data: null
            error: { code: forbidden, message: Bạn không có quyền thực hiện thao tác này }
            meta: { timestamp: '2026-08-22T09:00:00Z' }
    OrderNotFound:
      description: Đơn không tồn tại hoặc không thuộc về người gọi (SR5)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ReturnNotFound:
      description: Yêu cầu không tồn tại/không thuộc người gọi (SR5)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ReturnNotFoundAdmin:
      description: Yêu cầu không tồn tại
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ReturnActionNotAllowed:
      description: return_action_not_allowed — trạng thái hiện tại không cho phép thao tác
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: Lỗi xác thực trường dữ liệu
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    MoneyVND:
      type: string
      pattern: '^[0-9]+$'
      description: Số nguyên VND dạng chuỗi

    ReturnReasonCode:
      type: string
      enum: [defective, not_as_described, wrong_or_missing, changed_mind]

    ReturnRequestStatus:
      type: string
      enum: [pending_approval, approved, received, refunded, rejected, cancelled]

    ReturnRequestItemInput:
      type: object
      additionalProperties: false
      required: [orderItemId, quantity]
      properties:
        orderItemId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }

    CreateReturnRequestInput:
      type: object
      additionalProperties: false
      required: [items, reasonCode]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ReturnRequestItemInput' }
        reasonCode: { $ref: '#/components/schemas/ReturnReasonCode' }
        description:
          type: string
          maxLength: 500
          default: ''

    RejectReturnRequestInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }

    RecordRefundInput:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount:
          allOf: [{ $ref: '#/components/schemas/MoneyVND' }]
          description: Số nguyên VND > 0; server từ chối "0" và giá âm qua validation_error

    ReturnItemView:
      type: object
      required: [id, orderItemId, productName, imageUrl, unitPriceVnd, quantity]
      properties:
        id: { type: string, format: uuid }
        orderItemId: { type: string, format: uuid }
        productName: { type: string }
        imageUrl: { type: string }
        unitPriceVnd: { $ref: '#/components/schemas/MoneyVND' }
        quantity: { type: integer, minimum: 1 }

    ReturnRequestView:
      type: object
      required: [id, orderId, status, reasonCode, description, items, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ReturnRequestStatus' }
        reasonCode: { $ref: '#/components/schemas/ReturnReasonCode' }
        description: { type: string }
        rejectReason:
          type: string
          description: Chỉ khác rỗng khi status=rejected
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ReturnItemView' }
        refundAmountVnd:
          allOf: [{ $ref: '#/components/schemas/MoneyVND' }]
          description: Chỉ xuất hiện khi status=refunded
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        approvedAt: { type: [string, 'null'], format: date-time }
        rejectedAt: { type: [string, 'null'], format: date-time }
        receivedAt: { type: [string, 'null'], format: date-time }
        refundedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }

    AdminReturnRequestView:
      allOf:
        - $ref: '#/components/schemas/ReturnRequestView'
        - type: object
          required: [buyerEmail, orderTotalVnd, shippingFeeVnd, suggestedRefundVnd]
          properties:
            buyerEmail: { type: string, format: email }
            buyerUserId: { type: string, format: uuid }
            orderTotalVnd: { $ref: '#/components/schemas/MoneyVND' }
            shippingFeeVnd: { $ref: '#/components/schemas/MoneyVND' }
            suggestedRefundVnd:
              allOf: [{ $ref: '#/components/schemas/MoneyVND' }]
              description: Tính theo SR6 tại thời điểm đọc

    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }

    Meta:
      type: object
      required: [timestamp]
      properties:
        timestamp: { type: string, format: date-time }
        pagination: { $ref: '#/components/schemas/PaginationMeta' }

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - validation_error
            - unauthorized
            - forbidden
            - order_not_found
            - return_request_not_found
            - return_not_allowed
            - return_window_expired
            - return_request_exists
            - return_item_limit_exceeded
            - return_action_not_allowed
            - internal
        message: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
          description: Chỉ có với validation_error

    # ---- Envelopes ----
    ErrorEnvelope:
      type: object
      required: [success, message, data, error, meta]
      properties:
        success: { type: boolean, const: false }
        message: { type: string }
        data: { type: 'null' }
        error: { $ref: '#/components/schemas/ErrorBody' }
        meta: { $ref: '#/components/schemas/Meta' }

    ReturnRequestEnvelope:
      type: object
      required: [success, message, data, error, meta]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: { $ref: '#/components/schemas/ReturnRequestView' }
        error: { type: 'null' }
        meta: { $ref: '#/components/schemas/Meta' }

    ReturnRequestListEnvelope:
      type: object
      required: [success, message, data, error, meta]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/ReturnRequestView' }
        error: { type: 'null' }
        meta: { $ref: '#/components/schemas/Meta' }

    AdminReturnRequestEnvelope:
      type: object
      required: [success, message, data, error, meta]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: { $ref: '#/components/schemas/AdminReturnRequestView' }
        error: { type: 'null' }
        meta: { $ref: '#/components/schemas/Meta' }

    AdminReturnRequestListEnvelope:
      type: object
      required: [success, message, data, error, meta]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/AdminReturnRequestView' }
        error: { type: 'null' }
        meta: { $ref: '#/components/schemas/Meta' }

    # ---- ORDER-DELIVEREDAT-FIELD (additive vào orderResponse hiện có) ----
    DeliveredAtExtension:
      type: object
      properties:
        deliveredAt:
          type: [string, 'null']
          format: date-time
          description: |
            Thời điểm đơn chuyển sang delivered; null nếu chưa giao.
            Endpoint chịu ảnh hưởng: GET /orders/:id, GET /orders (danh sách khách),
            GET /admin/orders, GET /admin/orders/:id — mọi response trả đối tượng đơn.
            Backfill: các đơn delivered trước migration lấy updated_at làm mốc.
      description: |
        Quy tắc derive phía client (chỉ để hiển thị, server vẫn là thẩm quyền):
        lượng còn được phép trả của một dòng = quantity đã mua − Σ(quantity của các
        yêu cầu trong GET /orders/{orderId}/return-requests có trạng thái thuộc tập
        pending_approval|approved|received|refunded) — đúng SR4.
