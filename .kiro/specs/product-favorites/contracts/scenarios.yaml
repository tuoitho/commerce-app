scenarios:
  - id: FAVORITES-API-001
    contract: FAVORITES-API
    requirement: REQ-FAV-01
    given: no Authorization header is supplied
    when: GET /api/v1/favorites
    then:
      status: 401
      assertions:
        - body.success is false
        - body.data is null
        - body.error.code is unauthorized
        - body.error.message is "Vui lòng đăng nhập để sử dụng danh sách yêu thích"
        - body.error.fields is absent
        - body.meta contains only timestamp

  - id: FAVORITES-API-002
    contract: FAVORITES-API
    requirement: REQ-FAV-01
    given: a valid admin access token is supplied
    when: GET /api/v1/favorites
    then:
      status: 403
      assertions:
        - body.error.code is forbidden
        - body.error.message is "Bạn không có quyền sử dụng danh sách yêu thích"

  - id: FAVORITES-API-003
    contract: FAVORITES-API
    requirement: REQ-FAV-05
    given: customer C1 has 15 favorites with distinct favorite dates
    when: GET /api/v1/favorites without page or limit
    then:
      status: 200
      assertions:
        - body.data contains the 12 newest favorites ordered by favoritedAt descending
        - equal favoritedAt values are ordered by product id ascending
        - body.meta.pagination equals page 1, limit 12, total 15, totalPages 2, hasNext true, hasPrev false
        - every item viewer.isFavorite is true

  - id: FAVORITES-API-004
    contract: FAVORITES-API
    requirement: REQ-FAV-05
    given: customer C1 has 15 favorites
    when: GET /api/v1/favorites?page=3&limit=12
    then:
      status: 200
      assertions:
        - body.data is an empty array
        - body.meta.pagination equals page 3, limit 12, total 15, totalPages 2, hasNext false, hasPrev true

  - id: FAVORITES-API-005
    contract: FAVORITES-API
    requirement: REQ-FAV-03
    given: customer C1 has not favorited active product P1
    when: PUT /api/v1/favorites/P1
    then:
      status: 200
      assertions:
        - body.data equals productId P1 and isFavorite true
        - body.message is "Đã thêm sản phẩm vào yêu thích"
        - one C1-P1 relationship exists after the request

  - id: FAVORITES-API-006
    contract: FAVORITES-API
    requirement: REQ-FAV-03
    given: customer C1 already favorited active product P1 at T1
    when: PUT /api/v1/favorites/P1 is repeated
    then:
      status: 200
      assertions:
        - body.data equals productId P1 and isFavorite true
        - exactly one C1-P1 relationship exists
        - the relationship favorite date remains T1

  - id: FAVORITES-API-007
    contract: FAVORITES-API
    requirement: REQ-FAV-03
    given: product P1 is unavailable from the public catalog because it is inactive, has no active variant, or does not exist
    when: customer C1 sends PUT /api/v1/favorites/P1
    then:
      status: 404
      assertions:
        - body.error.code is product_not_found
        - body.error.message is "Sản phẩm không tồn tại hoặc đã ngừng kinh doanh"
        - no relationship is created

  - id: FAVORITES-API-008
    contract: FAVORITES-API
    requirement: REQ-FAV-03
    given: customer C1 is authenticated
    when: PUT /api/v1/favorites/not-a-uuid
    then:
      status: 400
      assertions:
        - body.error.code is validation_error
        - body.error.fields.productId is present
        - persistence is not mutated

  - id: FAVORITES-API-009
    contract: FAVORITES-API
    requirement: REQ-FAV-04
    given: customer C1 favorited product P1 before P1 became inactive
    when: DELETE /api/v1/favorites/P1
    then:
      status: 200
      assertions:
        - body.data equals productId P1 and isFavorite false
        - body.message is "Đã bỏ sản phẩm khỏi yêu thích"
        - the C1-P1 relationship does not exist

  - id: FAVORITES-API-010
    contract: FAVORITES-API
    requirement: REQ-FAV-04
    given: customer C1 has no relationship to valid UUID P1
    when: DELETE /api/v1/favorites/P1
    then:
      status: 200
      assertions:
        - body.data equals productId P1 and isFavorite false
        - no product existence or activity check is required

  - id: FAVORITES-API-011
    contract: FAVORITES-API
    requirement: REQ-FAV-08
    given: customers C1 and C2 both favorited product P1
    when: C1 removes P1 and both customers list favorites
    then:
      status: 200
      assertions:
        - P1 is absent from C1 favorites
        - P1 remains present in C2 favorites
        - C1 cannot observe any C2 favorite relationship

  - id: FAVORITES-API-012
    contract: FAVORITES-API
    requirement: REQ-FAV-06
    given: customer C1 favorited P1 before P1 became inactive
    when: GET /api/v1/favorites
    then:
      status: 200
      assertions:
        - P1 remains in body.data
        - P1.active is false
        - P1.inStock is false
        - P1 includes name, primaryImageUrl, price fields, favoritedAt, and viewer.isFavorite true
        - minPriceVnd and maxPriceVnd come from all stored variants, with stored product price as fallback when no variant remains

  - id: FAVORITES-API-013
    contract: FAVORITES-API
    requirement: REQ-FAV-09
    given: customer C1 is authenticated
    when: GET /api/v1/favorites?page=0&limit=13
    then:
      status: 400
      assertions:
        - body.error.code is validation_error
        - body.error.fields contains page and limit
        - body.error.fields contains no unrelated fields
        - body.meta contains only timestamp

  - id: FAVORITES-API-014
    contract: FAVORITES-API
    requirement: REQ-FAV-09
    given: customer C1 is authenticated
    when: separate GET /api/v1/favorites requests supply page=abc, page=-1, limit=abc, or limit=0
    then:
      status: 400
      assertions:
        - body.error.code is validation_error
        - each response contains the invalid parameter in body.error.fields
        - no response contains unrelated field errors
        - no persistence query is executed

  - id: FAVORITES-API-015
    contract: FAVORITES-API
    requirement: REQ-FAV-04
    given: customer C1 is authenticated
    when: DELETE /api/v1/favorites/not-a-uuid
    then:
      status: 400
      assertions:
        - body.error.code is validation_error
        - body.error.fields.productId is present
        - no relationship is deleted

  - id: FAVORITES-API-016
    contract: FAVORITES-API
    requirement: REQ-FAV-09
    given: an unexpected repository failure is injected without logging secrets
    when: customer C1 lists or mutates favorites
    then:
      status: 500
      assertions:
        - body.error.code is internal
        - body.error.message is "Đã xảy ra lỗi hệ thống"
        - body.error.fields is absent
        - body.meta contains only timestamp
        - response contains no SQL, table name, database URL, token, stack, or implementation detail

  - id: FAVORITES-API-017
    contract: FAVORITES-API
    requirement: REQ-FAV-03
    given: customer C1 adds active product P1 and the browser session and API process connection are subsequently torn down
    when: C1 authenticates in a fresh session and requests favorites plus product P1 detail
    then:
      status: 200
      assertions:
        - P1 remains present in the favorites list
        - P1.viewer.isFavorite is true in product detail
        - persistence is read from PostgreSQL rather than retained frontend or process memory

  - id: CATALOG-VIEWER-001
    contract: CATALOG-VIEWER
    requirement: REQ-FAV-02
    given: no Authorization header is supplied
    when: GET /api/v1/products
    then:
      status: 200
      assertions:
        - every product contains viewer.isFavorite false
        - no favorite relationship query is executed

  - id: CATALOG-VIEWER-002
    contract: CATALOG-VIEWER
    requirement: REQ-FAV-02
    given: customer C1 favorited P1 but not P2 and both products are returned
    when: C1 sends GET /api/v1/products
    then:
      status: 200
      assertions:
        - P1.viewer.isFavorite is true
        - P2.viewer.isFavorite is false
        - one batch relationship lookup covers all returned product IDs

  - id: CATALOG-VIEWER-003
    contract: CATALOG-VIEWER
    requirement: REQ-FAV-02
    given: customer C1 favorited featured product P1
    when: C1 sends GET /api/v1/products/featured
    then:
      status: 200
      assertions:
        - P1.viewer.isFavorite is true
        - featured-product selection and ordering are unchanged

  - id: CATALOG-VIEWER-004
    contract: CATALOG-VIEWER
    requirement: REQ-FAV-02
    given: customer C1 favorited active product P1
    when: C1 sends GET /api/v1/products/P1
    then:
      status: 200
      assertions:
        - body.data.viewer.isFavorite is true
        - existing product-detail fields are unchanged

  - id: CATALOG-VIEWER-005
    contract: CATALOG-VIEWER
    requirement: REQ-FAV-09
    given: an invalid or expired bearer token is supplied
    when: GET /api/v1/products
    then:
      status: 401
      assertions:
        - body.error.code is invalid_token
        - body.error.message is "Phiên đăng nhập không hợp lệ hoặc đã hết hạn"
        - body.error.fields is absent
        - body.meta contains only timestamp
        - no catalog response is returned anonymously

  - id: CATALOG-VIEWER-006
    contract: CATALOG-VIEWER
    requirement: REQ-FAV-02
    given: a valid admin bearer token is supplied
    when: GET /api/v1/products
    then:
      status: 200
      assertions:
        - every product contains viewer.isFavorite false
        - no customer favorite relationship is read

  - id: CATALOG-VIEWER-007
    contract: CATALOG-VIEWER
    requirement: REQ-FAV-10
    given: the same catalog data and filters before and after viewer-state support
    when: anonymous GET /api/v1/products is compared without the viewer property
    then:
      status: 200
      assertions:
        - product membership, ordering, intrinsic fields, and pagination are identical
        - viewer is the only required additive product property

  - id: CATALOG-VIEWER-008
    contract: CATALOG-VIEWER
    requirement: REQ-FAV-07
    given: a product response contains viewer.isFavorite true and no session override exists
    when: ProductCard or Product Detail initializes its favorite control
    then:
      status: initialized
      assertions:
        - the control renders the favorite state as active
        - no separate per-product status request is sent

  - id: CATALOG-VIEWER-009
    contract: CATALOG-VIEWER
    requirement: REQ-FAV-10
    given: a fixed catalog dataset before and after viewer-state support
    when: anonymous GET /api/v1/products/featured responses are compared without viewer
    then:
      status: 200
      assertions:
        - product membership, ordering, and every intrinsic field are identical
        - every returned product adds viewer.isFavorite false

  - id: CATALOG-VIEWER-010
    contract: CATALOG-VIEWER
    requirement: REQ-FAV-10
    given: active product P1 before and after viewer-state support
    when: anonymous GET /api/v1/products/P1 responses are compared without viewer
    then:
      status: 200
      assertions:
        - every intrinsic product-detail field is identical
        - the response adds only required viewer.isFavorite false

  - id: CATALOG-VIEWER-011
    contract: CATALOG-VIEWER
    requirement: REQ-FAV-10
    given: the assembled application includes viewer-state support
    when: existing cart, checkout, administration catalog, and administration authentication regression suites run
    then:
      status: pass
      assertions:
        - existing cart API and customer cart flow remain available
        - existing checkout API and customer checkout flow remain available
        - existing administration catalog endpoints and frontend remain available
        - no favorites-specific contract is added to the administration frontend

  - id: CATALOG-VIEWER-012
    contract: CATALOG-VIEWER
    requirement: REQ-FAV-09
    given: an unexpected batch favorite-status read failure is injected
    when: an authenticated customer requests products, featured products, or product detail
    then:
      status: 500
      assertions:
        - body.error.code is internal
        - body.error.message is "Đã xảy ra lỗi hệ thống"
        - body.error.fields is absent
        - no partial catalog data or favorite relationship detail is returned

  - id: CATALOG-VIEWER-013
    contract: CATALOG-VIEWER
    requirement: REQ-FAV-02
    given: an invalid bearer token is supplied in separate requests
    when: GET /api/v1/products, GET /api/v1/products/featured, and GET /api/v1/products/P1 are called
    then:
      status: 401
      assertions:
        - every endpoint returns invalid_token with the same Vietnamese message
        - no endpoint falls back to anonymous behavior

  - id: FAVORITE-AUTH-REDIRECT-001
    contract: FAVORITE-AUTH-REDIRECT
    requirement: REQ-FAV-01
    given: authentication restoration is complete and the visitor is anonymous at /products?q=phone#results
    when: the visitor activates a favorite control
    then:
      status: redirect
      assertions:
        - navigation target is exactly /login?redirect=%2Fproducts%3Fq%3Dphone%23results
        - no favorite API mutation is sent

  - id: FAVORITE-AUTH-REDIRECT-002
    contract: FAVORITE-AUTH-REDIRECT
    requirement: REQ-FAV-01
    given: an anonymous visitor reached login from a favorite control on product P1
    when: login succeeds
    then:
      status: returned
      assertions:
        - navigation returns to the encoded local route
        - no add-favorite mutation is replayed
        - P1 remains not favorited until the customer activates the control again

  - id: FAVORITE-AUTH-REDIRECT-003
    contract: FAVORITE-AUTH-REDIRECT
    requirement: REQ-FAV-07
    given: AuthProvider is still restoring a session
    when: the favorites page or favorite control renders
    then:
      status: auth-loading
      assertions:
        - no login redirect occurs before restoration completes
        - no favorite mutation occurs before restoration completes

  - id: FAVORITE-AUTH-REDIRECT-004
    contract: FAVORITE-AUTH-REDIRECT
    requirement: REQ-FAV-01
    given: redirect is empty, malformed percent encoding, https://evil.example, //evil.example, or /\\evil.example
    when: login succeeds
    then:
      status: returned
      assertions:
        - navigation falls back to /
        - external navigation is not performed

  - id: FAVORITE-SESSION-STATE-001
    contract: FAVORITE-SESSION-STATE
    requirement: REQ-FAV-07
    given: no optimistic override exists for P1
    when: resolveIsFavorite is called with the server-provided value true
    then:
      status: resolved
      assertions:
        - the resolved value is true

  - id: FAVORITE-SESSION-STATE-002
    contract: FAVORITE-SESSION-STATE
    requirement: REQ-FAV-07
    given: P1 is confirmed not favorite and no mutation is pending
    when: mutate requests nextState true and the API succeeds
    then:
      status: confirmed
      assertions:
        - P1 resolves true immediately while the request is pending
        - P1 remains true after confirmation
        - all mounted consumers resolve the same override

  - id: FAVORITE-SESSION-STATE-003
    contract: FAVORITE-SESSION-STATE
    requirement: REQ-FAV-07
    given: P1 is confirmed not favorite and an optimistic add begins
    when: the API request fails
    then:
      status: rolled-back
      assertions:
        - P1 resolves false after rollback
        - pending state clears
        - mutate resolves kind failed with restoredState false and the original error
        - the favorite control displays Vietnamese failure feedback for the failed outcome

  - id: FAVORITE-SESSION-STATE-004
    contract: FAVORITE-SESSION-STATE
    requirement: REQ-FAV-07
    given: a mutation for P1 is pending
    when: the P1 favorite control is activated again
    then:
      status: coalesced
      assertions:
        - no second API mutation is sent
        - the duplicate mutate call resolves immediately as kind coalesced with the optimistic state
        - the control remains disabled and exposes pending state

  - id: FAVORITE-SESSION-STATE-005
    contract: FAVORITE-SESSION-STATE
    requirement: REQ-FAV-07
    given: customer C1 has optimistic overrides in the provider
    when: authentication changes to no customer or customer C2
    then:
      status: reset
      assertions:
        - all C1 overrides and pending state are discarded
        - C2 server-provided state becomes authoritative

  - id: FAVORITE-UI-001
    contract: FAVORITE-UI
    requirement: REQ-FAV-07
    given: an authenticated customer focuses a favorite control inside ProductCard or Product Detail
    when: the customer activates the control with keyboard or pointer
    then:
      status: accessible-toggle
      assertions:
        - exactly one favorite mutation is requested
        - the ProductCard detail link is not activated by the favorite control
        - non-favorite state exposes accessible name "Thêm vào yêu thích" and aria-pressed false
        - favorite state exposes accessible name "Bỏ khỏi yêu thích" and aria-pressed true
        - the control exposes visible focus
        - pressed state is communicated programmatically and with more than color alone

  - id: FAVORITE-UI-002
    contract: FAVORITE-UI
    requirement: REQ-FAV-05
    given: an authenticated customer opens /favorites
    when: data is loading, empty, failed, or populated
    then:
      status: rendered
      assertions:
        - loading renders an explanatory skeleton state
        - an empty first page renders an empty-state action
        - failure renders Vietnamese feedback and a working retry action
        - populated state renders pagination from server metadata with 12 items requested per page

  - id: FAVORITE-UI-003
    contract: FAVORITE-UI
    requirement: REQ-FAV-06
    given: the favorites response contains inactive product P1
    when: the favorites page renders P1
    then:
      status: discontinued
      assertions:
        - P1 name, image, latest stored price, and discontinued label are visible
        - product-detail navigation and purchase affordances are disabled
        - the remove-favorite control remains enabled and accessible

  - id: FAVORITE-UI-004
    contract: FAVORITE-UI
    requirement: REQ-FAV-07
    given: customer authentication restoration is complete
    when: desktop header and mobile navigation render
    then:
      status: rendered
      assertions:
        - authenticated customers receive a Favorites navigation target for /favorites
        - anonymous visitors do not receive authenticated Favorites navigation

  - id: FAVORITE-UI-005
    contract: FAVORITE-UI
    requirement: REQ-FAV-01
    given: the customer opens /favorites while authentication is restoring or after restoration finds no customer
    when: route protection evaluates
    then:
      status: protected
      assertions:
        - restoration renders auth-loading without a premature redirect
        - an anonymous result redirects to /login?redirect=%2Ffavorites
        - authenticated customer content never exposes another customer's items

  - id: FAVORITE-UI-006
    contract: FAVORITE-UI
    requirement: REQ-FAV-06
    given: customer C1 has inactive favorite P1 and an administrator reactivates P1 with an active variant
    when: C1 reloads favorites and opens a catalog surface containing P1
    then:
      status: reactivated
      assertions:
        - the original favorite relationship and favoritedAt remain unchanged
        - P1.active and P1.viewer.isFavorite are true
        - product-detail navigation is enabled again
        - normal active-product purchase affordances are enabled subject to stock

  - id: FAVORITE-UI-007
    contract: FAVORITE-UI
    requirement: REQ-FAV-05
    given: the customer requests favorites page 4 and the response reports totalPages 2, or reports totalPages 0
    when: the favorites page processes the successful out-of-range response
    then:
      status: recovered
      assertions:
        - totalPages 2 causes replace-navigation to the same route with page 2 and a page 2 reload
        - totalPages 0 causes replace-navigation to the same route with page 1 and a page 1 reload
        - the reloaded page 1 with totalPages 0 renders the first-page empty state
        - browser history does not retain the out-of-range page entry

  - id: FAVORITE-PERSISTENCE-001
    contract: FAVORITE-PERSISTENCE
    requirement: REQ-FAV-08
    given: active product P1 and customer C1 exist
    when: concurrent insert attempts create C1-P1
    then:
      status: persisted
      assertions:
        - exactly one row exists for C1-P1
        - no duplicate-key error escapes the repository
        - created_at is assigned by PostgreSQL
        - created_at falls between the database timestamps immediately before and after the insert

  - id: FAVORITE-PERSISTENCE-002
    contract: FAVORITE-PERSISTENCE
    requirement: REQ-FAV-03
    given: C1-P1 exists with created_at T1
    when: the idempotent add query runs again
    then:
      status: unchanged
      assertions:
        - exactly one row exists for C1-P1
        - created_at remains T1

  - id: FAVORITE-PERSISTENCE-003
    contract: FAVORITE-PERSISTENCE
    requirement: REQ-FAV-08
    given: C1 has multiple product_favorites rows
    when: user C1 is physically deleted
    then:
      status: cascaded
      assertions:
        - all rows referencing C1 are deleted
        - other customers' rows remain

  - id: FAVORITE-PERSISTENCE-004
    contract: FAVORITE-PERSISTENCE
    requirement: REQ-FAV-08
    given: multiple customers favorited P1
    when: product P1 is physically deleted
    then:
      status: cascaded
      assertions:
        - all rows referencing P1 are deleted
        - favorites for other products remain

  - id: FAVORITE-PERSISTENCE-005
    contract: FAVORITE-PERSISTENCE
    requirement: REQ-FAV-06
    given: C1-P1 exists and P1 is soft-deleted
    when: the paginated favorite read runs for C1
    then:
      status: projected
      assertions:
        - C1-P1 remains persisted
        - P1 is returned with active false and inStock false
        - catalog presentation fields remain readable

  - id: FAVORITE-PERSISTENCE-006
    contract: FAVORITE-PERSISTENCE
    requirement: REQ-FAV-05
    given: C1 has favorites with different and equal created_at values
    when: two adjacent pages are read without intervening mutations
    then:
      status: ordered
      assertions:
        - rows are ordered by created_at descending and product_id ascending
        - no row appears on both pages
        - total count is scoped to C1

  - id: FAVORITE-PERSISTENCE-007
    contract: FAVORITE-PERSISTENCE
    requirement: REQ-FAV-04
    given: customer C1 has no relationship to product ID P1
    when: the scoped delete runs once or repeatedly
    then:
      status: unchanged
      assertions:
        - no relationship exists for C1-P1
        - no absence error escapes the repository
        - no other customer relationship is deleted

  - id: FAVORITE-PERSISTENCE-008
    contract: FAVORITE-PERSISTENCE
    requirement: REQ-FAV-03
    given: P1 is product-inactive or has no active variant, while active P2 has an active variant
    when: the atomic add operation is attempted for C1-P1 and C1-P2
    then:
      status: eligibility-enforced
      assertions:
        - no C1-P1 relationship is inserted
        - exactly one C1-P2 relationship is inserted
        - eligibility and insertion occur in one database statement or repository transaction without a race-visible duplicate error

  - id: FAVORITE-PERSISTENCE-009
    contract: FAVORITE-PERSISTENCE
    requirement: REQ-FAV-08
    given: C1 favorites P1 and P3, C2 favorites P2, and the caller supplies product IDs P1 and P2
    when: batch favorite status is read for customer C1
    then:
      status: scoped
      assertions:
        - the result contains only P1
        - C2-P2 is not exposed
        - C1-P3 is not returned because P3 was not requested
        - one batch query handles all supplied product IDs

  - id: FAVORITE-PERSISTENCE-010
    contract: FAVORITE-PERSISTENCE
    requirement: REQ-FAV-08
    given: the database is at migration version immediately before product favorites
    when: the favorites up migration, schema assertions, and down migration run in sequence
    then:
      status: reversible
      assertions:
        - up creates product_favorites with every asserted column, key, cascade, default, and index capability
        - persistence.assertions.sql passes after up
        - down removes product_favorites and its indexes without changing users, products, or prior schema objects
        - the database returns to the prior migration version cleanly
