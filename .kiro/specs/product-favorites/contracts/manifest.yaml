revision_policy:
  frozen_revisions_are_immutable: true
  every_observable_change_requires_a_new_revision: true
  additive: new optional inputs or outputs that preserve all existing defaults and semantics
  semantic: changed defaults, state transitions, authorization, ordering, or failure meaning
  breaking: removed or renamed fields, newly required caller input, or incompatible schema changes

contracts:
  - id: FAVORITES-API
    revision: 1
    status: FROZEN
    compatibility: additive
    compatibility_policy:
      consumers_ignore_unknown_response_fields: true
      additive_changes: [optional response fields, new optional query parameters]
      breaking_changes: [removed or renamed fields, new required request input, changed idempotency or authorization semantics]
    requirements: [REQ-FAV-01, REQ-FAV-03, REQ-FAV-04, REQ-FAV-05, REQ-FAV-06, REQ-FAV-08, REQ-FAV-09]
    providers: [backend-commerce]
    consumers: [frontend-customer]
    artifacts:
      - .dream/specs/product-favorites/contracts/api.openapi.yaml
      - .dream/specs/product-favorites/contracts/scenarios.yaml

  - id: CATALOG-VIEWER
    revision: 1
    status: FROZEN
    compatibility: additive
    compatibility_policy:
      consumers_ignore_unknown_response_fields: true
      additive_changes: [optional viewer fields in later revisions]
      breaking_changes: [omitting viewer, changing anonymous false semantics, changing invalid-token behavior]
    requirements: [REQ-FAV-02, REQ-FAV-07, REQ-FAV-09, REQ-FAV-10]
    providers: [backend-commerce]
    consumers: [frontend-customer]
    artifacts:
      - .dream/specs/product-favorites/contracts/api.openapi.yaml
      - .dream/specs/product-favorites/contracts/scenarios.yaml

  - id: FAVORITE-AUTH-REDIRECT
    revision: 1
    status: FROZEN
    compatibility: additive
    compatibility_policy:
      additive_changes: [new local redirect sources]
      breaking_changes: [external redirects, replaying the original mutation, redirecting before authentication restoration]
    requirements: [REQ-FAV-01, REQ-FAV-07]
    providers: [frontend-customer]
    consumers: [frontend-customer]
    artifacts:
      - .dream/specs/product-favorites/contracts/frontend.contract.ts
      - .dream/specs/product-favorites/contracts/scenarios.yaml

  - id: FAVORITE-SESSION-STATE
    revision: 1
    status: FROZEN
    compatibility: additive
    compatibility_policy:
      additive_changes: [new independently optional provider observations]
      breaking_changes: [changing optimistic precedence, rollback, pending coalescing, or account-reset semantics]
    requirements: [REQ-FAV-07]
    providers: [frontend-customer]
    consumers: [frontend-customer]
    artifacts:
      - .dream/specs/product-favorites/contracts/frontend.contract.ts
      - .dream/specs/product-favorites/contracts/scenarios.yaml

  - id: FAVORITE-UI
    revision: 1
    status: FROZEN
    compatibility: additive
    compatibility_policy:
      additive_changes: [new optional presentation metadata that preserves interaction semantics]
      breaking_changes: [removing a required surface or state, enabling inactive navigation or purchase, weakening accessibility]
    requirements: [REQ-FAV-01, REQ-FAV-05, REQ-FAV-06, REQ-FAV-07]
    providers: [frontend-customer]
    consumers: [customer-browser]
    artifacts:
      - .dream/specs/product-favorites/contracts/frontend.contract.ts
      - .dream/specs/product-favorites/contracts/scenarios.yaml

  - id: FAVORITE-PERSISTENCE
    revision: 1
    status: FROZEN
    compatibility: additive
    compatibility_policy:
      additive_changes: [new non-semantic indexes]
      breaking_changes: [key or foreign-key changes, timestamp rewrites, relationship duplication, inactive-row removal]
    requirements: [REQ-FAV-03, REQ-FAV-04, REQ-FAV-05, REQ-FAV-06, REQ-FAV-08]
    providers: [backend-commerce]
    consumers: [backend-commerce]
    artifacts:
      - .dream/specs/product-favorites/contracts/persistence.assertions.sql
      - .dream/specs/product-favorites/contracts/scenarios.yaml
