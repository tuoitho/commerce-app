schema: spec-driven

context: |
  OpenSpec is the durable source of truth for behavioral changes in this
  repository. Superpowers provides implementation, debugging, review, and
  verification discipline without creating duplicate specifications or plans.

  Repository-wide workflow policy is defined in AGENTS.md. Do not assume a
  technology stack or architecture that is not supported by repository files.

rules:
  proposal:
    - Identify affected boundaries and contracts.
    - State whether the change is backward compatible.
    - Separate goals from non-goals when scope could be ambiguous.
  specs:
    - Describe externally observable behavior with testable requirements.
    - Include failure and edge-case behavior when relevant.
    - Avoid prescribing implementation details unless they are contractual.
  design:
    - Explain cross-boundary interactions when more than one independently owned or externally consumed boundary is affected.
    - Explain contract compatibility and migration when relevant.
    - Record material decisions that implementation must not reinvent.
  tasks:
    - Order tasks by dependency and stabilize shared contracts before dependent work.
    - Keep tasks independently verifiable where possible.
    - Include tests and deterministic verification for observable requirements.

operations:
  apply:
    guidance:
      - Treat approved OpenSpec artifacts as the source of truth.
      - Stop and update the artifacts when implementation reveals a material gap or contradiction.
      - Keep verification summaries concise and evidence-based.
  archive:
    guidance:
      - Confirm requirements and completed tasks have deterministic evidence.
      - Identify any verification that could not be performed before archiving.
