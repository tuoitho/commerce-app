    requirements:
      - REQ-REVIEW-01
      - REQ-REVIEW-02
      - REQ-REVIEW-03
      - REQ-REVIEW-04
      - REQ-REVIEW-05
      - REQ-REVIEW-06
      - REQ-REVIEW-07
      - REQ-REVIEW-08
      - REQ-REVIEW-09
      - REQ-REVIEW-10
    providers: [backend-review]
    consumers: [frontend-review, frontend-admin-review]
    compatibility:
      classification: breaking-public-author-label-semantics
      inherits: PURCHASED-REVIEW-API@4
      rollout: backend-provider-and-frontend-public-review-consumer-must-deploy-revision-5-together; provider-5-consumer-4-and-provider-4-consumer-5-are-unsupported; frontend-admin-revision-4-consumer-remains-compatible
      breaking_changes:
        - public Review authorLabel changes from the fixed neutral label to a backend-masked current account email
        - public product review collection uses a distinct PublicReview representation while mutation, owned and admin representations retain Review
      unchanged:
